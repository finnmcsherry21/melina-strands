// Midnight of "YYYY-MM-DD" in a time zone, as a real moment in time.
function zoneOffsetMs(ts, tz){
  const f = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const o = {}; for (const p of f.formatToParts(new Date(ts))) o[p.type] = +p.value;
  return Date.UTC(o.year, o.month - 1, o.day, o.hour % 24, o.minute, o.second) - ts;
}
function midnightIn(ymd, tz){
  const [y, m, d] = ymd.split("-").map(Number), local = Date.UTC(y, m - 1, d);
  let t = local - zoneOffsetMs(local, tz); t = local - zoneOffsetMs(t, tz); return t;
}

  $("#mf").href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify({ name: TITLE, short_name: "Panama", display: "standalone", start_url: location.href, background_color: "#aedfee", theme_color: "#aedfee", icons: [{ src: icon, sizes: "180x180", type: "image/png" }] })); } catch(e){}

let state = "";
function render(){
  const ms = target - now();
  if (ms <= 0){
    if (state !== "done"){ state = "done";
      $("#card").innerHTML = `<div class="done"></div><div class="sweet"></div>`;
      $("#card .done").textContent = DONE_TEXT; $("#card .sweet").textContent = "Pack the sunscreen, babe. Panama, here we come! ☀️";
      confetti(30); }
  } else {
    if (state !== "count"){ state = "count";
      $("#card").innerHTML = `<div class="grid">${["days", "hours", "min", "sec"].map(l => `<div class="unit"><div class="num" id="n-${l}">0</div><div class="lbl">${l}</div></div>`).join("")}</div><div class="sweet"></div><div class="sleeps" id="sleeps"></div>`;
      $("#card .sweet").textContent = SWEET_LINE; }
    const s = Math.floor(ms / 1000);
    $("#n-days").textContent = Math.floor(s / 86400); $("#n-hours").textContent = pad(Math.floor(s % 86400 / 3600));
    $("#n-min").textContent = pad(Math.floor(s % 3600 / 60)); $("#n-sec").textContent = pad(s % 60);
    const sleeps = Math.ceil(ms / 86400000);
    $("#sleeps").textContent = sleeps === 1 ? "🌙 1 more sleep!" : `🌙 ${sleeps} more sleeps`;
  }
  const ex = $("#extras"); ex.innerHTML = "";
  (Array.isArray(EXTRA) ? EXTRA : []).forEach(e => {
    if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(e.date || "")) return;
    const left = midnightIn(e.date, TIME_ZONE) - now(); if (left <= 0) return;
    const d = Math.floor(left / 86400000), h = Math.floor(left % 86400000 / 3600000);
    const row = document.createElement("div"); row.className = "extra"; row.innerHTML = `<span></span><b></b>`;
    row.querySelector("span").textContent = e.label || e.date; row.querySelector("b").textContent = `${d}d ${h}h`; ex.appendChild(row);
  });
}
function confetti(n){ const icons = ["🌴", "💛", "🩵", "🍍", "🥭", "☀️", "🇵🇦"];
  for (let i = 0; i < n; i++){ const f = document.createElement("div"); f.className = "float"; f.textContent = icons[i % icons.length];
    f.style.left = (Math.random() * 95) + "vw"; f.style.fontSize = (20 + Math.random() * 22) + "px"; f.style.animationDelay = (Math.random() * 1.2) + "s";
    document.body.appendChild(f); setTimeout(() => f.remove(), 5500); } }
render(); setInterval(render, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
</script>
</body>
